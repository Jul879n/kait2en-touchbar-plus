# Touch Bar Plus. Copia de la configuración de KaiT2en más las claves nuevas.
# Límites (ms) de la duración aprendida, por separado para la capa de medios y la de teclas F.
minimum_timeout_ms = 5000
maximum_timeout_ms = 30000
continuation_window_ms = 15000
fn_long_press_ms = 600

# t2tb_backlight has only a few hardware levels. Values above its maximum are
# clamped by the daemon.
active_brightness = 128
haptic_feedback = true
# Set false to play the key-press waveform only, without a touch-up waveform.
haptic_touch_up = true


# Glyph color as #rrggbb. The default is a cool white that matches the slightly
# blue keyboard backlight. Outlines and the pressed state are derived from it.
key_color = "#dce6ff"

# Multi-finger swipes. On the dark bar every volume_swipe_step_px of horizontal
# two-finger travel sends one volume step (right is louder), and every
# brightness_swipe_step_px of three-finger travel one display brightness step
# (right is brighter). On the lit bar a two-finger swipe of
# mode_swipe_px switches between the media and F-key rows. A touch waits up to
# two_finger_window_ms for a second finger before it wakes the bar or presses
# a key. A tap shorter than that fires on release.
two_finger_window_ms = 100
volume_swipe_step_px = 40
brightness_swipe_step_px = 40
mode_swipe_px = 160

# Dim the key glyphs along with the keyboard backlight (read from
# /sys/class/leds/*kbd_backlight, updated on UPower changes). The bar keeps a
# readable minimum while the keyboard backlight is off. Off by default: the
# keyboard slider then leaves the Touch Bar brightness alone.
follow_keyboard_backlight = false

# Show the escape key and restore the keyboard backlight on keyboard,
# trackpad or Touch Bar activity. Both go dark after this idle period.
activity_backlight = true
activity_timeout_ms = 30000

# Show "Artist – Title" on the dark bar for five seconds when a media player
# (MPRIS) starts a new track, with previous/next keys at both ends.
show_track_changes = true

# --- Touch Bar Plus -------------------------------------------------------
# Mantener la barra encendida mientras la pantalla lo esté.
always_on = true
# Apagar la barra al bloquear o apagarse la pantalla. Un toque la enciende 2 min.
screen_lock_dark = true
# Atenuar tras este tiempo sin uso (0 = nunca) al nivel dim_brightness.
dim_after_ms = 120000
dim_brightness = 1
# Mover la imagen 1 px cada intervalo para proteger el OLED.
pixel_shift = true
pixel_shift_interval_ms = 180000
# Tarjeta animada de notificaciones y sugerencias de escritura.
notifications = true
suggestions = true
# Mostrar en la barra las apps de Super+Tab / Alt+Tab (requiere la extensión de GNOME).
app_switcher = true
# Mantener volumen/brillo este tiempo para abrir el slider.
hold_slider_ms = 400

# Idioma de los textos de la barra: auto (según el sistema), es o en.
language = "auto"

# Color de los íconos: mono (color de teclas) o full (un color por ícono y apps a color).
icon_color = "mono"

# Pantalla de Touch ID. Estilo A a F (F = resplandor desde el sensor).
touch_id_style = "F"
# Color por estado: "auto" sigue el color de las teclas, o #rrggbb.
touch_id_color_waiting = "auto"
touch_id_color_retry = "#ff9f0a"
touch_id_color_failed = "#ff453a"
touch_id_color_matched = "#34c759"
# Texto por estado (vacío usa el del idioma; hasta 24 caracteres ASCII).
touch_id_text_waiting = ""
touch_id_text_retry = ""
touch_id_text_failed = ""
touch_id_text_matched = ""
# Animación: "completa", "sutil" o "ninguna". Velocidad en % (50 a 200).
touch_id_animation = "completa"
touch_id_speed = 100
